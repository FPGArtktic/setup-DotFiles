# ===========================================================================
#  setup-DotFiles :: tmux configuration
#  Installed as ~/.tmux.conf by setup-dotFiles.sh.
#
#  Same configuration as the podman_base container image, adapted for a real
#  host: the container pins bash as the login shell, a host does not, and a
#  host has internet so tpm can fetch its plugins on first start.
# ===========================================================================

# ---------------------------------------------------------------------------
#  Prefix
# ---------------------------------------------------------------------------
# C-b collides with readline's "back one character"; C-Space does not.
set-option -g prefix C-Space
unbind-key C-b
bind-key C-Space send-prefix

# ---------------------------------------------------------------------------
#  General behaviour
# ---------------------------------------------------------------------------
set -g mouse on
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 10
set -g focus-events on
set -g set-clipboard on

# default-shell is deliberately left unset. The container image fixes it to
# /bin/bash because bash is the only login shell in there; on a host tmux's
# own default - $SHELL, falling back to the passwd entry - is what the user
# actually logs in with, bash or zsh, and both are configured by this repo.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc,xterm-256color:Tc,alacritty:Tc,foot:Tc"

# ---------------------------------------------------------------------------
#  vi-style copy mode
# ---------------------------------------------------------------------------
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ---------------------------------------------------------------------------
#  Windows and panes
# ---------------------------------------------------------------------------
# Intuitive splits that keep the current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Pane navigation without the prefix
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# ---------------------------------------------------------------------------
#  Status line
# ---------------------------------------------------------------------------
# status-right runs git in the directory of the active pane, so the branch
# shown is always the branch you are looking at.
set -g status-interval 5
set -g status-style "bg=colour234,fg=colour250"
set -g status-left  "#[bg=colour33,fg=colour232,bold] #S #[default] "
set -g status-right "#[fg=colour245]#(cd '#{pane_current_path}' && git branch --show-current 2>/dev/null) #[fg=colour250]| %H:%M #[bg=colour33,fg=colour232,bold] #h "
set -g status-left-length 30
set -g status-right-length 80
setw -g window-status-current-style "fg=colour33,bold"

# ---------------------------------------------------------------------------
#  Plugins, managed by tpm
# ---------------------------------------------------------------------------
# Everything above is set before tpm runs on purpose: tmux-sensible only fills
# in options the user has left at their tmux default, so our history-limit,
# escape-time, default-terminal and status-interval have to be in place first
# or sensible's own values would be the ones that stick.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# resurrect saves and restores sessions on demand; continuum does it on a
# timer and brings the last session back when tmux starts.
set -g @continuum-restore 'on'

# Clone tpm on first start. Without this the @plugin lines above are inert on
# a fresh machine: they only declare what tpm should fetch, and tpm has to
# exist before it can fetch anything.
if-shell '[ ! -d ~/.tmux/plugins/tpm ]' \
    "run-shell 'git clone --depth 1 https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Keep this line at the very bottom - tpm has to run after every @plugin
# declaration it is meant to see. It was commented out in earlier versions of
# this file, which is why none of the four plugins above ever loaded.
run '~/.tmux/plugins/tpm/tpm'
