# ===========================================================================
#  99-audiophile.conf - WirePlumber: resampler quality, no sink suspend
#  Installed by setup-dotFiles.sh into ~/.config/wireplumber/wireplumber.conf.d/.
#
#  Deliberately NO audio.format. A fixed S32LE here once killed both USB
#  DACs: the M20 and the FiiO E10 only offer S16_LE/S24_3LE, so their ALSA
#  nodes were never created ("error pcm info: No such device") and only HDMI
#  was left. PipeWire negotiates the deepest format per card on its own -
#  S24_3LE on USB, S32_LE on the onboard codec - and does it better than a
#  fixed entry.
#
#  No api.alsa.period-size either: the M20 is ASYNC with a 125 us interval
#  and negotiates a sensible period (512) itself.
# ===========================================================================
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.*" } ]
    actions = {
      update-props = {
        # Best resampler quality (0-14, default 4). It only matters when
        # resampling cannot be avoided - streams at different rates mixed
        # together, or a card that cannot do the rate of the file.
        resample.quality                = 10
        # The DAC never suspends: otherwise the M20 clicks its relay on
        # wake-up and swallows the start of the track.
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
