# ===========================================================================
#  99-audiophile.conf - PipeWire clock: play every file at its own rate
#  Installed by setup-dotFiles.sh into ~/.config/pipewire/pipewire.conf.d/.
#
#  Lets each card run at the native rate of the material instead of
#  resampling everything to 48 kHz. PipeWire trims this list to what a card
#  can actually do, so one list covers all the hardware:
#
#    Q Acoustics M20 (USB)  44100 48000 88200 96000 176400 192000
#    FiiO E10 (USB)         44100 48000 96000
#    onboard HDA / HDMI     whatever the codec reports
#
#  No audio.format here, and none anywhere else: see docs/AUDIO.md.
# ===========================================================================
context.properties = {
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 44100 48000 88200 96000 176400 192000 ]
    default.clock.quantum       = 1024
    default.clock.min-quantum   = 32
    default.clock.max-quantum   = 2048
}
