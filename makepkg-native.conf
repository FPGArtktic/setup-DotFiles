#!/hint/bash
# shellcheck disable=SC2034,SC2206  # makepkg reads these; OPTIONS is rebuilt word by word
# ===========================================================================
#  makepkg-native.conf - build AUR and ABS packages for THIS CPU, quickly
#  Installed by setup-dotFiles.sh as /etc/makepkg.conf.d/zz-native.conf.
#
#  makepkg sources /etc/makepkg.conf and then every /etc/makepkg.conf.d/*.conf
#  in order, so this file edits the stock values instead of restating them:
#  a pacman upgrade that changes the defaults in /etc/makepkg.conf is still
#  picked up, and this file never turns into a .pacnew. "zz-" sorts it after
#  rust.conf, whose RUSTFLAGS it extends.
#
#  Packages built with this run on this CPU generation only. Do not copy them
#  to another machine.
# ===========================================================================

# --- faster code: tune for the CPU this is built on --------------------------
# -march=native implies -mtune=native. -O2 stays: -O3 breaks a handful of
# packages and buys little in return.
CFLAGS="${CFLAGS/-march=x86-64 -mtune=generic/-march=native}"
CXXFLAGS="${CXXFLAGS/-march=x86-64 -mtune=generic/-march=native}"
RUSTFLAGS="${RUSTFLAGS:-} -C target-cpu=native -C opt-level=3"

# --- faster builds -----------------------------------------------------------
# Every core. The stock file leaves MAKEFLAGS commented out, i.e. -j1.
MAKEFLAGS="-j$(nproc)"

# Build in /tmp, which is tmpfs: no writes to the SSD, and object files never
# wait for the disk. A build bigger than the tmpfs (the kernel, chromium) has
# to override it: BUILDDIR=~/.cache/makepkg-build makepkg ...
BUILDDIR=/tmp/makepkg

# ccache: a rebuild of something already compiled once - the next kernel
# point release, a -git package - reuses every unchanged object.
BUILDENV=(${BUILDENV[@]/!ccache/ccache})

# No -debug split packages: nobody here installs them, and producing them
# costs a strip pass and a second package per build. lto stays on - it is
# slower to build but makes better code.
OPTIONS=(${OPTIONS[@]/#debug/!debug})

# Package compression: zstd level 1 on every core instead of the default 19.
# A finished package is installed right away and deleted with the cache, so
# its size hardly matters, and level 19 is the slowest part of a small build.
COMPRESSZST=(zstd -c -T0 -1 -)
